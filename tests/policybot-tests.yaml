# =============================================================================
# JSON Output
# =============================================================================

- description: json_annual_leave — JSON Output
  vars:
    question: >
      Evaluate the Annual Leave Policy for an employee asking how many paid
      vacation days they receive per calendar year. Return the policy evaluation as JSON.
  assert:
    - type: is-json
      value: &policyEvaluationSchema
        type: object
        properties:
          answer:
            type: string
          policy:
            type: string
          requires_approval:
            type: boolean
        required:
          - answer
          - policy
          - requires_approval
        additionalProperties: false
    - type: javascript
      value: file://graders/graders.js:isValidPolicyEvaluationJson
    - type: javascript
      value: file://graders/graders.js:hasPolicy
      config:
        expectedPolicy: Annual Leave Policy
    - type: javascript
      value: file://graders/graders.js:hasRequiresApproval
      config:
        expectedRequiresApproval: false
    - type: llm-rubric
      value: >
        The JSON answer correctly identifies the Annual Leave Policy and states
        that employees receive 20 paid vacation days per calendar year.
        It must not invent approval requirements.
  metadata:
    id: json_annual_leave
    category: JSON Output

- description: json_expense_499 — JSON Output
