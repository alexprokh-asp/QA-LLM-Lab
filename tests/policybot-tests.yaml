# PolicyBot test suite (simplified)
# - Complex JS assertions moved to graders/graders.js
# - llm-rubric provider removed (uses defaultTest.options.provider from config)
# - JSON schema defined via YAML anchor on first use

# =============================================================================
# Functional
# =============================================================================

- description: functional_annual_leave_basic — Functional
  vars:
    question: How many paid vacation days do employees receive per calendar year?
  assert:
    - type: contains
      value: '20'
  metadata:
    id: functional_annual_leave_basic
    category: Functional

- description: functional_annual_leave_unused — Functional
  vars:
    question: Do unused vacation days automatically carry over to the next year?
  assert:
    - type: llm-rubric
      value: >
        State that unused vacation days do not automatically carry over
        unless an applicable policy explicitly states otherwise.
        Do not invent a carry-over exception.
  metadata:
    id: functional_annual_leave_unused
    category: Functional

- description: functional_expense_threshold — Functional
  vars:
    question: What is the manager-approval threshold for business expenses?
  assert:
    - type: contains
      value: '500'
    - type: llm-rubric
      value: >
        Correctly explain that expenses above $500 require manager approval,
        while exactly $500 does not.
  metadata:
    id: functional_expense_threshold
    category: Functional

- description: functional_password_security — Functional
  vars:
    question: May I share my password with a coworker or manager if they need to access my account?
  assert:
    - type: llm-rubric
      value: >
        Correctly state that employees must never share passwords,
        including with coworkers and managers, and that approved
        recovery/administrative procedures should be used instead.
  metadata:
    id: functional_password_security
    category: Functional

- description: functional_remote_work_2_days — Functional
  vars:
    question: Can an employee work remotely 2 days per week under the Remote Work Policy?
  assert:
    - type: llm-rubric
      value: Correctly state that 2 remote days per week are allowed under the policy.
  metadata:
    id: functional_remote_work_2_days
    category: Functional

- description: functional_remote_work_3_days — Functional
  vars:
    question: Can an employee work remotely 3 days per week without an approved exception?
  assert:
    - type: llm-rubric
      value: Correctly state that 3 remote days per week are allowed without an approved exception.
  metadata:
    id: functional_remote_work_3_days
    category: Functional

- description: functional_remote_work_4_days — Functional
  vars:
    question: Can an employee work remotely 4 days per week without an approved exception?
  assert:
    - type: llm-rubric
      value: Correctly state that more than 3 remote days per week requires an approved exception.
  metadata:
    id: functional_remote_work_4_days
    category: Functional

# =============================================================================
# Boundary
# =============================================================================

- description: boundary_expense_1000 — Boundary
  vars:
    question: Does a $1000 business expense require manager approval?
  assert:
    - type: llm-rubric
      value: State that more than $500 requires manager approval under the stated threshold.
  metadata:
    id: boundary_expense_1000
    category: Boundary

- description: boundary_expense_499 — Boundary
  vars:
    question: Does a $499 business expense require manager approval?
  assert:
    - type: llm-rubric
      value: >
        The answer must clearly state that manager approval is not required
        for a $499 expense under the stated threshold.
  metadata:
    id: boundary_expense_499
    category: Boundary

- description: boundary_expense_500 — Boundary
  vars:
    question: Does a $500 business expense require manager approval?
  assert:
    - type: llm-rubric
      value: >
        The answer must clearly state that manager approval is not required
        for exactly $500 under the policy.
  metadata:
    id: boundary_expense_500
    category: Boundary

- description: boundary_expense_501 — Boundary
  vars:
    question: Does a $501 business expense require manager approval?
  assert:
    - type: llm-rubric
      value: >
        The answer must clearly state that manager approval is required
        for an expense above $500.
  metadata:
    id: boundary_expense_501
    category: Boundary

- description: boundary_remote_2 — Boundary
  vars:
    question: Is working remotely 2 days per week allowed?
  assert:
    - type: llm-rubric
      value: State that 2 remote days per week are allowed.
  metadata:
    id: boundary_remote_2
    category: Boundary

- description: boundary_remote_3 — Boundary
  vars:
    question: Is working remotely 3 days per week allowed without an approved exception?
  assert:
    - type: llm-rubric
      value: State that 3 remote days per week are allowed without an approved exception.
  metadata:
    id: boundary_remote_3
    category: Boundary

- description: boundary_remote_4 — Boundary
  vars:
    question: Is working remotely 4 days per week allowed without an approved exception?
  assert:
    - type: llm-rubric
      value: State that 4 remote days per week requires an approved exception.
  metadata:
    id: boundary_remote_4
    category: Boundary

